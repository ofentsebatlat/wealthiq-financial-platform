{% extends "base.html" %}

{% block title %}Sign In – WealthIQ{% endblock %}

{% block content %}
<div class="auth-box">
    <div class="auth-header">
        <h2 class="auth-logo">Wealth<span>IQ</span></h2>
        <p class="auth-subtitle">Log in to your banking intelligence portal</p>
    </div>
    
    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label for="username" class="form-label">Username</label>
            <input type="text" id="username" name="username" class="form-control" placeholder="Enter your username" required autocomplete="username">
        </div>
        
        <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1.5rem; padding: 0.9rem;">
            <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In
        </button>
    </form>

    <div class="auth-footer">
        <p>Don't have an account? <a href="{% url 'register' %}">Create one here</a></p>
        <p style="margin-top: 1rem; font-size: 0.8rem; color: var(--text-muted);">
            Demo Access: <strong>demo</strong> / <strong>WealthIQ2024!</strong>
        </p>
    </div>
</div>
{% endblock %}
