{% extends "base.html" %}

{% block title %}Create Account – WealthIQ{% endblock %}

{% block content %}
<div class="auth-box" style="max-width: 480px;">
    <div class="auth-header">
        <h2 class="auth-logo">Wealth<span>IQ</span></h2>
        <p class="auth-subtitle">Create your smart Capitec banking profile</p>
    </div>
    
    <form method="POST">
        {% csrf_token %}
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div class="form-group">
                <label for="first_name" class="form-label">First Name</label>
                <input type="text" id="first_name" name="first_name" class="form-control" placeholder="John" required>
            </div>
            <div class="form-group">
                <label for="last_name" class="form-label">Last Name</label>
                <input type="text" id="last_name" name="last_name" class="form-control" placeholder="Doe" required>
            </div>
        </div>

        <div class="form-group">
            <label for="username" class="form-label">Username</label>
            <input type="text" id="username" name="username" class="form-control" placeholder="johndoe12" required autocomplete="username">
        </div>

        <div class="form-group">
            <label for="email" class="form-label">Email Address</label>
            <input type="email" id="email" name="email" class="form-control" placeholder="john@example.com" required autocomplete="email">
        </div>
        
        <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required autocomplete="new-password">
        </div>

        <div class="form-group">
            <label for="password2" class="form-label">Confirm Password</label>
            <input type="password" id="password2" name="password2" class="form-control" placeholder="••••••••" required autocomplete="new-password">
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.9rem;">
            <i class="fa-solid fa-user-plus"></i> Register Profile
        </button>
    </form>

    <div class="auth-footer">
        <p>Already have an account? <a href="{% url 'login' %}">Sign in here</a></p>
    </div>
</div>
{% endblock %}
